<!DOCTYPE html>
<html>
<head><title>Students</title></head>
<body>
    <h1>Students</h1>
    <ul id="students"></ul>
    <script>
        fetch("/api/students")
            .then(r => r.json())
            .then(names => {
                const list = document.getElementById("students");
                names.forEach(name => {
                    const item = document.createElement("li");
                    item.textContent = name;
                    list.appendChild(item);
                });
            });
    </script>
</body>
</html>
